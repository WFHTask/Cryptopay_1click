<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌入式支付演示 - USDT Payment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(17, 153, 142, 0.1) 0%, transparent 50%);
            color: white;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            color: #00ff9f;
            text-shadow: 0 0 20px rgba(0, 255, 159, 0.5);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }

        .header p::before {
            content: '// ';
            color: #00b8ff;
        }

        .demo-section {
            display: grid;
            grid-template-columns: 1fr 470px;
            gap: 40px;
            align-items: flex-start;
        }

        .product-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 159, 0.3);
            padding: 40px;
            box-shadow: 0 0 40px rgba(0, 255, 159, 0.2);
        }

        .product-card h2 {
            color: #00ff9f;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 159, 0.5);
        }

        .product-card h2::before {
            content: '[ ';
            color: #00b8ff;
        }

        .product-card h2::after {
            content: ' ]';
            color: #00b8ff;
        }

        .product-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .product-desc::before {
            content: '> ';
            color: #00b8ff;
        }

        .price {
            font-size: 48px;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
            font-weight: bold;
        }

        .buy-btn {
            width: 100%;
            padding: 20px;
            background: rgba(0, 255, 159, 0.1);
            color: #00ff9f;
            border: 2px solid #00ff9f;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .buy-btn:hover {
            background: rgba(0, 255, 159, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 159, 0.5);
            text-shadow: 0 0 10px rgba(0, 255, 159, 0.8);
            transform: translateY(-2px);
        }

        .payment-container {
            position: sticky;
            top: 20px;
        }

        #payment-frame {
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(15, 23, 42, 0.5);
            border: 2px dashed rgba(0, 255, 159, 0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(0, 255, 159, 0.2);
        }

        .features h3 {
            color: #00b8ff;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .features h3::before {
            content: '// ';
            color: #00ff9f;
        }

        .features ul {
            list-style: none;
        }

        .features li {
            padding: 10px 0;
            color: rgba(255, 255, 255, 0.7);
            padding-left: 20px;
            position: relative;
        }

        .features li::before {
            content: '>';
            position: absolute;
            left: 0;
            color: #00ff9f;
            font-weight: bold;
        }

        @media (max-width: 1024px) {
            .demo-section {
                grid-template-columns: 1fr;
            }

            .payment-container {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 DEMO SHOP</h1>
            <p>嵌入式USDT支付演示页面</p>
        </div>

        <div class="demo-section">
            <!-- 商品信息 -->
            <div class="product-card">
                <h2>游戏会员</h2>
                <p class="product-desc">30天超级会员，畅享所有特权功能</p>
                <div class="price">¥88.88</div>
                <button class="buy-btn" onclick="createPayment()">立即购买</button>

                <div class="features">
                    <h3>会员特权</h3>
                    <ul>
                        <li>无限游戏时长</li>
                        <li>专属游戏皮肤</li>
                        <li>VIP客服支持</li>
                        <li>优先匹配队列</li>
                    </ul>
                </div>
            </div>

            <!-- 支付区域 -->
            <div class="payment-container">
                <div id="payment-frame">
                    <div>
                        <p>点击"立即购买"按钮</p>
                        <p>生成支付二维码</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function createPayment() {
            try {
                // 显示加载状态
                document.getElementById('payment-frame').innerHTML = '<p>正在生成支付二维码...</p>';

                // 调用API创建支付
                const response = await fetch('http://localhost:8080/api/payment/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        api_key: '7407ace8d21615cdafaf8594b7211319dbae9c42ccccd28e63239ced75c60e27',
                        order_id: 'DEMO' + Date.now(),
                        amount: 88.88,
                        notify_url: 'http://localhost:8080/api/payment/callback',
                        redirect_url: 'http://localhost:3000/payment/success'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    // 嵌入iframe
                    document.getElementById('payment-frame').innerHTML = data.data.iframe_code;
                    console.log('支付创建成功！');
                    console.log('Embed URL:', data.data.embed_url);
                } else {
                    document.getElementById('payment-frame').innerHTML = 
                        '<p style="color: #ff4444;">创建失败：' + data.error + '</p>';
                }
            } catch (error) {
                document.getElementById('payment-frame').innerHTML = 
                    '<p style="color: #ff4444;">请求失败：' + error.message + '</p>';
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
