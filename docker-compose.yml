version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: payment_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: epusdt
      MYSQL_USER: epusdt
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./epusdt/sql/v0.0.1.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - payment_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin数据库管理界面
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: payment_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
      PMA_ARBITRARY: 1
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - payment_network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: payment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - payment_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Epusdt支付服务
  epusdt:
    build:
      context: ./epusdt/src
      dockerfile: ../../Dockerfile.epusdt
    container_name: payment_epusdt
    ports:
      - "8000:8000"
    volumes:
      - epusdt_runtime:/app/runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment_network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payment_backend
    environment:
      - PORT=8080
      - GIN_MODE=release
      - EPUSDT_URL=http://epusdt:8000
      - EPUSDT_API_TOKEN=123456
      - NOTIFY_URL=http://backend:8080/api/payment/callback
      - REDIRECT_URL=http://localhost:3000/payment/success
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=epusdt
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      epusdt:
        condition: service_started
    networks:
      - payment_network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - payment_network
    restart: unless-stopped

networks:
  payment_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  epusdt_runtime:

